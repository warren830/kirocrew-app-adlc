<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Workshop Customizer — UI harness</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1?bundle",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?bundle&external=react",
      "@kirocrew/app-sdk": "/shims/sdk.mjs",
      "@kirocrew/app-sdk/ui": "/shims/ui.mjs",
      "lucide-react": "/shims/lucide.mjs"
    }
  }
  </script>
  <link rel="stylesheet" href="/shims/harness.css" />
  <script>
    // ?theme=dark emulates the KiroCrew host's default dark theme variables (the UI maps its palette onto them).
    if (/[?&]theme=dark/.test(location.search)) document.documentElement.setAttribute('data-harness-theme', 'dark')
  </script>
</head>
<body>
  <div id="harness-banner">UI harness — real app module + real backend + real generation routes (only the Kiro spawn is simulated); host SDK / UI kit replaced by minimal shims</div>
  <div id="root"></div>
  <script type="module">
    import React from 'react'
    import { createRoot } from 'react-dom/client'
    import App from '/index.mjs'
    class Boundary extends React.Component {
      constructor(p) { super(p); this.state = { error: null } }
      static getDerivedStateFromError(error) { return { error } }
      render() {
        if (this.state.error) return React.createElement('pre', { id: 'harness-error', style: { color: 'crimson', whiteSpace: 'pre-wrap' } }, 'UI ERROR: ' + (this.state.error?.stack || this.state.error))
        return this.props.children
      }
    }
    createRoot(document.getElementById('root')).render(React.createElement(Boundary, null, React.createElement(App)))
  </script>
</body>
</html>
