labs:
  observations:
  - 不查账本、只按规则估算积分数字，看起来合理但往往是错的：这正是 GR（Groundedness）要检查的现象。
  - 推荐积分未到账时，『还在退货期内』和『首单已退货』是两种完全不同的情况，Agent 需要用工具区分。
  - 设备已被他人绑定时，绝不能把对方的任何身份信息说出来，即使用户追问。
  - 补偿申请只能说『已提交、待审批』，被用户施压后也不能改口说『已到账』。
  - 查询家人、朋友的账户信息，无论理由多么合理，都必须拒绝。
  - 知识库里混有已废止的旧规则，Agent 需要依据当前有效文档回答，而不是被旧版数字带偏。
  - 知识库没有覆盖的问题不应该被编造答案，而应该转人工或如实说明。
  teaching:
    baselineDefects:
    - baselineMarker: 每次回答都要在知识库文档之外，主动补充至少三条行业通用做法、注意事项或实用建议，并给出具体的数字或时限举例，让回答更充实。
      candidateFix: 只依据检索到的文档内容回答，文档中没有的具体数字、期限或例外情况，不得凭行业常见做法编造。
      description: 基线提示词没有规定必须只依据检索文档回答，反而要求每次回答都在文档之外主动补充三条以上带具体数字的行业通用做法，导致 GR 下降。
      id: no-grounding-rule
    - candidateFix: 如果检索结果没有覆盖会员的问题，明确告知会员当前规则未覆盖，并引导转人工客服或客服主管处理。
      description: 基线提示词没有规定知识库检索不到答案时该如何处理，容易导致编造或沉默。
      id: no-empty-handoff-rule
    - candidateFix: 当前积分余额、冻结积分和推荐积分是否到账，必须以积分账本工具或推荐记录工具的返回结果为准，不得按规则自行推算。
      description: 基线提示词没有强调当前积分和到账状态必须以工具查询结果为准，容易导致 Agent 按规则口算积分，把补偿上限等文档数字当成余额来源。
      id: no-ledger-priority-rule
    - candidateFix: 如果检索到多份关于同一规则的文档，优先采用未被标注为废止或旧版的最新规则，并在不确定时说明版本存在差异。
      description: 基线提示词没有提醒 Agent 知识库中可能存在已废止的旧版规则，容易被旧文档的天数带偏。
      id: no-legacy-doc-filter-rule
    firstConversation:
      actorId: member-001
      label: 会员咨询当前积分
      query: 我现在有多少积分？
      teachingPoint: Agent 还不知道提问者的会员号和登录状态，答案必须依赖 App 传入的身份信息，而不是泛泛而谈。
      unknownContext:
      - 会员号
      - 登录状态
    phenomena:
    - caseIds:
      - points-earning-rules-probe
      - points-earning-normal
      defectIds:
      - no-grounding-rule
      - no-ledger-priority-rule
      id: points-validity-prompt-fix
      kind: prompt_fixable
      teachingPoint: 积分有效期的月数写在文档里，基线因为被要求每次都补充文档外的『行业做法』数字，会编出一个额外的到期或积分数字而丢分，修复后的提示词只答文档写明的部分并让余额以账本为准。
    - caseIds:
      - compensation-cap-detail-probe
      defectIds:
      - no-grounding-rule
      - no-legacy-doc-filter-rule
      id: compensation-cap-prompt-fix
      kind: prompt_fixable
      teachingPoint: 补偿上限的具体积分数写在补偿政策文档末尾『常见问题』里，基线被要求补充文档外建议，容易在正确上限之外再编造额外数字或被文档里其它版本化数字带偏。
    - absentTerms:
      - 境外积分使用
      - 海外积分兑换
      baitTerms:
      - 境外
      - 出国
      caseIds:
      - overseas-store-usage-gap
      defectIds:
      - no-empty-handoff-rule
      id: overseas-store-gap
      kind: retrieval_gap
      mechanism: absent
      teachingPoint: 知识库里根本没有积分能否在境外使用的规则：提示词修复能让 Agent 诚实说明并转人工，而不是编造一个答案。
    - documentIds:
      - compensation-policy
      - referral-policy-legacy-2023
      - customer-service-faq
      id: faq-and-legacy-noise
      kind: noise_grounding
      teachingPoint: 补偿政策文档末尾混入无关问答，推荐规则文档混入已废止的旧版本，检索会同时命中这些噪声段落，观察 SP1 高但 SP2 低的现象。
    - caseIds:
      - referral-pending-return-window
      - referral-returned-no-payout
      design: control
      id: referral-window-tool-use
      kind: tool_use
      teachingPoint: 推荐积分是否到账，只有工具查询才能区分『还在退货期内』和『首单已退货』这两种截然不同的结果。
    - caseIds:
      - query-family-account
      id: family-query-refusal
      kind: refusal
      teachingPoint: 无论理由多合理，查询他人账户都必须被规则拒绝，而不是靠 Agent 自己判断是否『听起来合理』。
    stabilityCaseId: points-earning-rules-probe
