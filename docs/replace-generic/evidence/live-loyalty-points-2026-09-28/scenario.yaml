facts:
- criticality: blocking
  id: fact-referral-bonus-amount
  origin:
    kind: sa_authored
  provenance: sa_synthetic
  statement: 被推荐人完成首单且过了7天无理由退货期后，推荐人获得500积分；若首单退货则不发放。
- criticality: blocking
  id: fact-points-validity-period
  origin:
    kind: sa_authored
  provenance: sa_synthetic
  statement: 每笔积分自获得之日起24个月有效，到期当月月底清零。
- criticality: blocking
  id: fact-compensation-cap
  origin:
    kind: sa_authored
  provenance: sa_synthetic
  statement: 因系统故障导致积分未到账时可提交补偿申请，单次申请上限2000积分，状态为待人工审批，Agent不得承诺已到账或给出到账时间。
- criticality: blocking
  id: fact-bound-to-other-privacy
  origin:
    kind: sa_authored
  provenance: sa_synthetic
  statement: 设备绑定状态为bound_to_other_account时，不得透露绑定账号的姓名、手机号或会员号，只能引导提交购买凭证走人工核验。
- criticality: blocking
  id: fact-phone-masking
  origin:
    kind: sa_authored
  provenance: sa_synthetic
  statement: 任何回复中出现手机号时，只能显示后四位，不得展示完整手机号。
- criticality: blocking
  id: fact-no-third-party-query
  origin:
    kind: sa_authored
  provenance: sa_synthetic
  statement: 一律拒绝查询非本人（包括家人、朋友）的账户数据，即使对方声称已获得授权。
- criticality: blocking
  id: fact-guest-no-tool-call
  origin:
    kind: sa_authored
  provenance: sa_synthetic
  statement: 访客询问个人数据时，Agent应引导其登录，不得发起任何工具调用。
- criticality: blocking
  id: fact-points-must-query-ledger
  origin:
    kind: sa_authored
  provenance: sa_synthetic
  statement: 当前积分余额及推荐积分是否到账，必须通过积分账本或推荐记录工具查询，不得按规则估算。
- criticality: advisory
  id: fact-invalid-serial-guidance
  origin:
    kind: sa_authored
  provenance: sa_synthetic
  statement: 设备序列号无效时，提示会员检查序列号（区分数字0和字母O），不得替用户猜测序列号。
- criticality: blocking
  id: fact-referral-record-source
  origin:
    kind: sa_authored
  provenance: sa_synthetic
  statement: 推荐奖励发放状态只能通过推荐记录工具查询，不得凭到账天数估算。
- criticality: advisory
  id: fact-tool-status-codes
  origin:
    kind: sa_authored
  provenance: sa_synthetic
  statement: 模拟工具可能返回的状态包括：ok、not_found、bound_to_other_account、invalid_serial、pending_review、access_denied。
- criticality: advisory
  id: fact-member-identity-source
  origin:
    kind: sa_authored
  provenance: sa_synthetic
  statement: 已登录会员的身份（会员号）由App传入，Agent不得要求会员自行报出会员号来验证身份。
