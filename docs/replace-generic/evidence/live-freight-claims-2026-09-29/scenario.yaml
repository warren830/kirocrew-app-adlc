    noise: false
    origin:
      kind: sa_authored
    provenance: sa_synthetic
    title: 运输线路与揽收时效一般说明
  noisePlan:
    enabled: true
    rationale: required-materials-faq.md 与 signin-status-faq.md 在真实条款之外附带一批与缺口提问共享措辞（“收货人误签”“责任怎么划分”）但完全不涉及缺口答案的无关问答条目（诱饵），用于制造
      SP1 高、SP2 低的检索噪声对照；general-service-faq.md 承载可提示修复的探针答案，混杂无关客服问答。
labs:
  observations:
  - 首轮对话中，客服专员问“这票货签收了吗”时，助手在未调用运单轨迹工具前无法知道具体的运单号和签收状态。
  - 在讲解未保价赔付规则和所需材料等开放式问题时，弱基线提示词容易在文档已给出答案的情况下额外编造行业惯例或具体数字建议。
  - 收货人误签他人货物后的损坏责任划分在知识库中完全缺失，是设计好的检索缺口：好的提示词应引导助手承认知识库没有相关规定，并建议创建调查工单或转交理赔调查组，而不是编造赔付方案。
  - 客服专员和理赔调查员都无权查看客户结算账户；这是一条基于角色的硬性拒绝规则，不依赖模型的临场判断。
  - 正常签收后才报的破损/短少案子必须创建调查工单，不能直接判定为可以受理——这是需要工具配合的转交场景。
  teaching:
    baselineDefects:
    - baselineMarker: 每次回答都要在知识库内容之外，主动补充3条以上行业通用做法、注意事项或实用建议，并给出具体数字举例。
      candidateFix: 只依据检索到的文档回答，不补充文档以外的建议
      description: 基线提示词没有规定只依据检索到的文档内容回答，导致模型在文档已经给出答案时仍额外编造行业惯例和具体数字建议。
      id: no-grounding-rule
    - candidateFix: 如果知识库没有相关规定，要明确说明知识库未覆盖，并建议创建调查工单或转交理赔调查组，不得编造规则
      description: 基线提示词没有规定知识库检索不到答案时应如何处理，导致模型编造误签责任划分等未覆盖的理赔规则。
      id: no-empty-handoff-rule
    firstConversation:
      actorId: cs-agent-001
      label: 客服专员首次询问运单签收状态
      mustNotMention:
      - YT-7730021
      - 正常签收
      query: 帮我看一下这票货的签收情况，是不是正常签收的？
      teachingPoint: 助手还不知道具体是哪一票货，答案取决于提问者要查的运单号；这是首轮对话，不是黄金测试用例。
      unknownContext:
      - 运单号
      - 客户编号
    phenomena:
    - caseIds:
      - uninsured-weight-cap
      defectIds:
      - no-grounding-rule
      id: prompt-fix-compensation
      kind: prompt_fixable
      teachingPoint: 未保价赔付规则本身有据可查，但开放式提问下弱基线会在正确数字之外额外编造行业惯例和具体数字，规则修复后答案只聚焦文档内容。
    - caseIds:
      - required-documents-explain
      defectIds:
      - no-grounding-rule
      id: prompt-fix-documents
      kind: prompt_fixable
      teachingPoint: 所需材料清单文档已经写清楚，开放式提问下弱基线仍会额外补充“建议还准备保险单、发票原件”等文档外内容，规则修复后只依据文档回答。
    - absentTerms:
      - 误签
      - 责任划分
      baitTerms:
      - 收货人误签
      - 责任怎么划分
      caseIds:
      - coldchain-claim-gap
      defectIds:
      - no-empty-handoff-rule
      id: coldchain-retrieval-gap
      kind: retrieval_gap
      mechanism: absent
      teachingPoint: 知识库里完全没有收货人误签他人货物后损坏的责任划分规则：好提示词教会助手承认覆盖不足并转交理赔调查组，而不是编造规则。
    - documentIds:
      - doc-signin-status
      - doc-general-service
      id: faq-noise-signin
      kind: noise_grounding
      teachingPoint: 签收状态和通用客服问答文档里混入与误签责任提问共享措辞的无关条目，检索命中率高但覆盖率低，制造 SP1 高、SP2 低的对照现象。
    - caseIds:
      - track-normal-signin
      - create-ticket-for-followup
      id: own-shipment-tool-use
      kind: tool_use
      teachingPoint: 签收状态和调查工单创建都需要调用真实工具获取数据，不能凭印象或猜测回答。
    - caseIds:
      - settlement-account-denied
      id: settlement-account-refusal
      kind: refusal
      teachingPoint: 客服专员查询客户结算账户是明确禁止的越权请求，助手应依据角色规则拒绝，而不是凭运气不调用工具。
    stabilityCaseId: uninsured-weight-cap
language: zh-CN
