    cases:
    - return:
        line: 华东-华南干线
        pickupTime: '2026-09-10T09:20:00+08:00'
        shipmentId: YT-7730021
        signinStatus: 正常签收
        signinTime: '2026-09-12T14:05:00+08:00'
