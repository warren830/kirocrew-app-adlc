      when:
        shipmentId: YT-7730021
    - return:
        line: 华北-西南干线
        pickupTime: '2026-09-01T08:00:00+08:00'
        shipmentId: YT-7730099
        signinStatus: 异常签收
        signinTime: '2026-09-02T16:40:00+08:00'
        status: ok
