  statement: 破损、短少理赔须在签收后7天内提出，超过时效不予受理。
- criticality: blocking
  id: fact-timeliness-delay
  origin:
    kind: sa_authored
  provenance: sa_synthetic
  source: knowledge-base/docs/claim-policy.md (第2条 理赔时效)
  statement: 延误理赔须在签收后15天内提出，超过时效不予受理。
- criticality: blocking
  id: fact-compensation-uninsured
  origin:
    kind: sa_authored
  provenance: sa_synthetic
  source: knowledge-base/docs/claim-policy.md (第3条 赔付标准)
  statement: 未保价货物按每公斤20元赔付，单票最高2000元。
- criticality: blocking
  id: fact-compensation-insured
  origin:
