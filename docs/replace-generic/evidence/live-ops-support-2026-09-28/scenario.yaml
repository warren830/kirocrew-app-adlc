  noisePlan:
    enabled: true
    rationale: 常见错误码手册和诊所对接 SOP 文档末尾附带与主题无关的 FAQ 段落，承载提示词可修复探针的答案；过期升级规则文档和内部 FAQ 文档把诱饵短语（“新诊所正式接入”“需要多长时间”）分别散落到彼此无关的琐事问答里，每条只复用一个诱饵短语，均不讨论新诊所接入本身，也不给出或指引接入所需时长的答案，用于制造
      absent 检索缺口对照。
labs:
  observations:
  - 知识缺失时（如新诊所正式接入需要多长时间）基线提示词会编造一个看似合理的时长，优化后的提示词会说明知识库无此资料并给出下一步。
  - P1 升级条件涉及两个独立指标（离线时长和队列长度，或 E-503 次数与时间窗口），基线提示词遇到具体数字时容易只答部分条件或直接编造缺失的数字。
  - 过期的 2021 年升级规则文档和无关 FAQ 文档会被检索工具一起召回，测试模型是否会被过期或无关内容带偏。
  teaching:
    baselineDefects:
    - baselineMarker: 每次回答都要在知识库内容之外，主动补充 3 条以上行业通用做法、注意事项或实用建议，并给出具体数字举例。
      candidateFix: 只依据知识库检索结果和工具返回结果回答，文档或工具没有给出的具体数字、时限或步骤，不得凭经验补充，也不得在文档之外添加行业通用做法或建议。
      description: 基线提示词没有规定必须只依据检索到的文档回答，反而要求每次回答都在知识库之外补充行业做法，遇到文档没写明的细节时会编造数字。
      id: no-grounding-rule
    - candidateFix: 当知识库检索结果和工具结果都无法回答问题时，必须明确说明当前没有这份资料，并建议用户建工单联系运维团队或相应负责人，不得编造答案。
      description: 基线提示词没有规定知识库检索不到答案时该怎么办，模型会编造一个看似合理的答案而不是说明缺口并升级。
      id: no-empty-handoff
    firstConversation:
      actorId: lab-tech-unknown
      label: 我们 Lab 现在还在线吗？
      query: 我们 Lab 现在还在线吗？队列多少了？
      teachingPoint: Agent 还不知道提问者属于哪个 Lab，无法直接回答，需要先确认身份或追问 Lab 编号。
      unknownContext:
      - 所属 Lab
      - Lab 编号
    phenomena:
    - caseIds:
      - e503-count-threshold
      defectIds:
      - no-grounding-rule
      id: prompt-fix-e503
      kind: prompt_fixable
      teachingPoint: 当知识库其实写明了具体门槛（3 次、1 小时）时，规则约束能让模型只引用文档中的数字，而不是自己额外补充行业做法或估算门槛。
    - caseIds:
      - e217-response-limit
      defectIds:
      - no-grounding-rule
      id: prompt-fix-e217
      kind: prompt_fixable
      teachingPoint: 文档只写了 E-217 的含义，没有写处理时限；规则约束后模型只回答含义，不再编造一个时限。
    - caseIds:
      - p1-full-condition-practice
      defectIds:
      - no-grounding-rule
      id: prompt-fix-p1-threshold
      kind: prompt_fixable
      teachingPoint: P1 的两个门槛（离线 15 分钟、队列 20 个）在文档里写明；规则约束后模型只引用文档中的数字，不再补充不存在的细节。
    - absentTerms:
