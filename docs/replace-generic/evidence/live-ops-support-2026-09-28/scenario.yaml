      - 接入完成天数
      baitTerms:
      - 新诊所正式接入
      - 需要多长时间
      caseIds:
      - new-clinic-onboarding-gap
      defectIds:
      - no-empty-handoff
      id: onboarding-gap
      kind: retrieval_gap
      mechanism: absent
      teachingPoint: 知识库里根本没有新诊所接入所需时长这份资料，提示词只能让回答更诚实，无法凭空补上这个知识缺口。
    - documentIds:
      - doc-error-codes
      - doc-service-sop
      - doc-legacy-escalation
      - doc-onboarding-faq
      id: faq-noise-docs
